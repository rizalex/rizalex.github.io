# .github/workflows/medium-import.yml
name: import-medium-posts-jekyll

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.9"       # ✅ use an exact version (e.g., 3.3.9 or 3.4.6)
          bundler-cache: true

      - name: Install tools
        run: |
          gem install jekyll-import rss safe_yaml

      - name: Import latest Medium posts
        run: |
          bundle exec jekyll import medium \
            --username rizalex \
            --canonical_link true

      - name: Commit new posts (if any)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _posts
          git commit -m "Import latest Medium posts" || echo "No changes"
          git push
